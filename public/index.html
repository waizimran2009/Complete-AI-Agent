<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantuMania — Complete AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="intros.css" />
  <link rel="stylesheet" href="launch-screen.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Google Identity Services (for OAuth sign-in) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

  <!-- API client (auth tokens + window.claude.complete + window.ariaChat) -->
  <script src="api-client.js"></script>

  <!-- Design system -->
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>

  <!-- Pages -->
  <script type="text/babel" src="page-login.jsx"></script>
  <script type="text/babel" src="page-overview.jsx"></script>
  <script type="text/babel" src="page-calls.jsx"></script>
  <script type="text/babel" src="page-email.jsx"></script>
  <script type="text/babel" src="page-posts.jsx"></script>
  <script type="text/babel" src="page-interview.jsx"></script>
  <script type="text/babel" src="page-ats.jsx"></script>
  <script type="text/babel" src="page-attendance.jsx"></script>
  <script type="text/babel" src="page-analytics.jsx"></script>
  <script type="text/babel" src="page-settings.jsx"></script>
  <script type="text/babel" src="page-chat.jsx"></script>
  <script type="text/babel" src="launch-screen.jsx"></script>
  <script type="text/babel" src="page-intros.jsx"></script>

  <!-- Main app shell -->
  <script type="text/babel" data-presets="env,react">
    const { useState, useEffect } = React;

    const PAGE_META = {
      chat:       { title: "Chat with Aria",         sub: "Your AI co-worker" },
      overview:   { title: "Overview",               sub: "Operations dashboard" },
      calls:      { title: "Calls Automation",       sub: "Inbound AI voice agent" },
      email:      { title: "Email Automation",       sub: "Inbox & AI replies" },
      posts:      { title: "Posts & Socials",        sub: "LinkedIn / X automation" },
      ats:        { title: "Resumes & ATS",          sub: "AI ranks every CV" },
      interview:  { title: "AI Interview Assistant", sub: "Live screening · anti-cheat" },
      attendance: { title: "Attendance & Leave",     sub: "Face check-in · geo-fence" },
      analytics:  { title: "HR Analytics",           sub: "Dashboards & reports" },
      settings:   { title: "Settings",               sub: "Model · languages · Supabase" },
    };

    function App() {
      const [booted,       setBooted]       = useState(false);
      const [page,         setPage]         = useState("chat");
      const [theme,        setTheme]        = useState("default");
      const [navKey,       setNavKey]       = useState(0);
      const [isMobile,     setIsMobile]     = useState(window.innerWidth < 768);
      const [sidebarOpen,  setSidebarOpen]  = useState(window.innerWidth >= 768);

      useEffect(() => {
        function onResize() {
          const mobile = window.innerWidth < 768;
          setIsMobile(mobile);
          if (!mobile) setSidebarOpen(true);
        }
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);

      useEffect(() => {
        if (theme === "default") document.documentElement.removeAttribute("data-theme");
        else document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      function navigate(p) {
        if (p === page) { if (isMobile) setSidebarOpen(false); return; }
        setPage(p);
        setNavKey(k => k + 1);
        if (isMobile) setSidebarOpen(false);
      }

      const meta = PAGE_META[page] || { title: "", sub: "" };

      // Launch screen plays first on every load
      if (!booted) {
        return <LaunchScreen onEnter={() => setBooted(true)} />;
      }

      // Main app — no auth gate
      return (
        <div className="app-root" style={{ display: "flex", flexDirection: "row", overflow: "hidden", height: "100dvh" }}>
          {/* Mobile overlay backdrop */}
          {isMobile && sidebarOpen && (
            <div
              onClick={() => setSidebarOpen(false)}
              style={{
                position: "fixed", inset: 0,
                background: "rgba(0,0,0,0.55)",
                zIndex: 150,
              }}
            />
          )}

          {/* Sidebar — fixed overlay on mobile, normal flow on desktop */}
          {sidebarOpen && (
            <div style={isMobile ? {
              position: "fixed", top: 0, left: 0, bottom: 0,
              zIndex: 200,
              display: "flex",
            } : { display: "flex" }}>
              <Sidebar current={page} onNavigate={navigate} onToggle={() => setSidebarOpen(false)} />
            </div>
          )}

          {/* Floating hamburger — only for chat page or desktop when sidebar closed */}
          {!sidebarOpen && (page === "chat" || !isMobile) && (
            <button
              onClick={() => setSidebarOpen(true)}
              title="Show sidebar"
              style={{
                position: "fixed", left: 12, top: "50%",
                transform: "translateY(-50%)",
                zIndex: 100,
                width: 32, height: 32,
                display: "flex", alignItems: "center", justifyContent: "center",
                background: "var(--bg-elev-2)",
                border: "1px solid var(--hairline-2)",
                borderRadius: "var(--r-md)",
                color: "var(--fg-2)",
                cursor: "pointer",
                boxShadow: "0 4px 16px rgba(0,0,0,0.4)",
                transition: "all 0.15s ease",
              }}
              onMouseEnter={e => { e.currentTarget.style.background = "rgba(var(--accent),0.12)"; e.currentTarget.style.color = "var(--fg-1)"; e.currentTarget.style.borderColor = "rgba(var(--accent),0.3)"; }}
              onMouseLeave={e => { e.currentTarget.style.background = "var(--bg-elev-2)"; e.currentTarget.style.color = "var(--fg-2)"; e.currentTarget.style.borderColor = "var(--hairline-2)"; }}
            >
              <IconMenu size={15} />
            </button>
          )}

          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden", position: "relative", minWidth: 0 }}>
            {page !== "chat" && <TopBar title={meta.title} subtitle={meta.sub} theme={theme} setTheme={setTheme} onMenuOpen={!sidebarOpen && isMobile ? () => setSidebarOpen(true) : undefined} />}
            <main key={navKey} style={{ flex: 1, overflowY: "auto", overflowX: "hidden", position: "relative" }}>
              {page !== "chat" && <PageIntro kind={page} label={meta.title} sublabel={meta.sub} k={navKey} />}
              <div className={`ambient-${page}`} />
              <div className="page-reveal" style={{ position: "relative", zIndex: 1 }}>
                {page === "chat"       && <ChatPage />}
                {page === "overview"   && <OverviewPage navigate={navigate} />}
                {page === "calls"      && <CallsPage />}
                {page === "email"      && <EmailPage />}
                {page === "posts"      && <PostsPage />}
                {page === "interview"  && <InterviewPage />}
                {page === "ats"        && <ATSPage />}
                {page === "attendance" && <AttendancePage />}
                {page === "analytics"  && <AnalyticsPage />}
                {page === "settings"   && <SettingsPage />}
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
